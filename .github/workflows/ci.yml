name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  buf-lint:
    name: Buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buf lint + format check (no breaking check here)
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          breaking: false
          pr_comment: false

      # Breaking check is skipped gracefully when main has no proto baseline
      # (first PR introducing protos). Once merged, this will catch real breaks.
      - name: buf breaking check
        run: |
          buf breaking \
            --against "https://github.com/${{ github.repository }}.git#branch=main" \
            --error-format github-actions || {
            echo "buf breaking skipped (no proto baseline on main yet)"
          }

  sqlc-check:
    name: sqlc generate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"

      - name: Check sqlc output is up to date
        run: |
          for dir in services/*/infrastructure/postgres/sqlc; do
            if [[ -f "$dir/sqlc.yaml" ]]; then
              cd "$dir"
              sqlc diff
              cd -
            fi
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mobpilot_test
          POSTGRES_PASSWORD: mobpilot_test
          POSTGRES_DB: mobpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -race -count=1 ./...

      - name: Run integration tests
        run: go test -race -count=1 -tags integration ./...
        env:
          POSTGRES_DSN: postgres://mobpilot_test:mobpilot_test@localhost:5432/mobpilot_test?sslmode=disable
          REDIS_URL: redis://localhost:6379

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        service: [identity]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o bin/${{ matrix.service }} \
            ./services/${{ matrix.service }}/cmd/${{ matrix.service }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
