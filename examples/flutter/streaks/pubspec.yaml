name: streaks
description: >
  Streaks — A habit tracker with social accountability.
  Reference implementation for the Mobpilot mobile backend platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  provider: ^6.1.0
  shared_preferences: ^2.5.0
  intl: ^0.20.0
  uuid: ^4.5.0
  url_launcher: ^6.3.0
  args: ^2.6.0
  json_annotation: ^4.9.0
  table_calendar: ^3.2.0
  flutter_secure_storage: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
